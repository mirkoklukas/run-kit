[project]
name = "runkit"
version = "0.1.0"
description = "Lightweight, reproducible experiment runs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mirko Klukas", email = "mirko.klukas@gmail.com" }]
keywords = ["experiment", "reproducibility", "research", "ml", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "rich>=15.0.0",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mirkoklukas/run-kit"
Repository = "https://github.com/mirkoklukas/run-kit"

[project.scripts]
runkit = "runkit.cli:app"

[project.optional-dependencies]
dev = ["ipython", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runkit"]

[tool.ruff]
line-length = 100
