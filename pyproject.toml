[project]
name = "runkit"
version = "0.1.0"
description = "Lightweight, reproducible experiment runs"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "typer>=0.26.7",
    "rich>=15.0.0",
]

[project.scripts]
runkit = "runkit.cli:app"

[project.optional-dependencies]
dev = ["ipython", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runkit"]

[tool.ruff]
line-length = 100
